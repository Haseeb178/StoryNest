<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — StoryNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header small">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">StoryNest</a>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="container login-page">
    <section class="card admin-card login-card">
      <h1>Admin Login</h1>
      <p>Enter the secure administrator credentials to manage story content.</p>
      <form id="loginForm" class="login-form">
        <label>Username<input id="username" type="text" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <div class="form-actions">
          <button class="btn primary" type="submit">Sign in</button>
        </div>
      </form>
      <p class="login-tip">Tip: The admin panel is protected to keep story data secure.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="yearLogin"></span> StoryNest — Secure access only.</p>
    </div>
  </footer>

  <script>
    document.getElementById('yearLogin').textContent = new Date().getFullYear();
    if (sessionStorage.getItem('storynest_admin') === 'true') {
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('redirect') || 'admin.html';
    }

    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (username === 'admin' && password === 'StoryNest2026!') {
        sessionStorage.setItem('storynest_admin', 'true');
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'admin.html';
        return;
      }
      alert('Invalid credentials. Please try again.');
    });
  </script>
</body>
</html>
